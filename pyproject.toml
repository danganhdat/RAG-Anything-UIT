[build-system]
requires = ["setuptools>=65", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-anything-uit"
version = "1.0.0"
description = "Multimodal RAG system with FastAPI, Streamlit, and Milvus"
requires-python = ">=3.11"
dependencies = [
    "raganything[all]",
    "pymilvus>=2.4,<3.0",
    "milvus-lite>=2.4,<3.0",
    "aiohttp>=3.9,<4.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.24,<1.0",
    "streamlit>=1.30,<2.0",
    "requests>=2.31,<3.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["rag_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
